spring:
  application:
    name: stockmate-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockmate}
    username: ${DB_USERNAME:stockmate}
    password: ${DB_PASSWORD:stockmate}
  jackson:
    deserialization:
      # Treat a missing number field (e.g. reorderLevel) as 0 instead of rejecting the whole request.
      # نعتبر الحقل الرقمي الناقص (مثل reorderLevel) صفر بدل رفض الطلب كامل.
      fail-on-null-for-primitives: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        # Caps ?size= so a client cannot request millions of rows in one call.
        # يحدّ ?size= حتى ما يطلب العميل ملايين الصفوف في طلب واحد.
        max-page-size: 100

server:
  port: ${PORT:8080}
  # Trust X-Forwarded-For only from internal proxies (nginx in the same Docker network), so the rate limiter
  # sees the real visitor IP and a visitor cannot fake it by sending the header directly.
  # نثق بـ X-Forwarded-For فقط من البروكسي الداخلي (nginx في نفس شبكة Docker)، فيشوف محدّد الطلبات عنوان الزائر الحقيقي
  # وما يقدر الزائر يزوّره بإرسال الترويسة بنفسه.
  forward-headers-strategy: native
  error:
    include-message: never

stockmate:
  jwt:
    # Must be at least 32 characters. Always override JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-0123456789}
    expiration: ${JWT_EXPIRATION:8h}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  vat-rate: 0.15
  time-zone: Asia/Riyadh
  seed:
    # Creates demo users and sample data on an empty database.
    enabled: ${SEED_DEMO_DATA:true}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
    staff-password: ${STAFF_PASSWORD:Staff@12345}
    customer-password: ${CUSTOMER_PASSWORD:Customer@12345}
  rate-limit:
    window: 10m
    orders: ${RATE_LIMIT_ORDERS:5}
    lookups: ${RATE_LIMIT_LOOKUPS:30}
  # Card and Apple Pay go to CARD_PAYMENT_PROVIDER: SANDBOX works with no gateway account (test cards on our own page);
  # MOYASAR or STRIPE need their secret key. Tabby and Tamara use their real API when a key is set, else the sandbox.
  # البطاقة وApple Pay يروحون لـ CARD_PAYMENT_PROVIDER: SANDBOX يشتغل بدون حساب بوابة (بطاقات تجريبية على صفحتنا)؛
  # وMOYASAR أو STRIPE يحتاجون المفتاح السري. وتابي وتمارا يستخدمون الـ API الحقيقي لو فيه مفتاح، وإلا الوضع التجريبي.
  payments:
    card-provider: ${CARD_PAYMENT_PROVIDER:SANDBOX}
    public-url: ${PUBLIC_URL:http://localhost:4200}
    moyasar:
      api-url: ${MOYASAR_API_URL:https://api.moyasar.com/v1}
      secret-key: ${MOYASAR_SECRET_KEY:}
    stripe:
      api-url: ${STRIPE_API_URL:https://api.stripe.com}
      secret-key: ${STRIPE_SECRET_KEY:}
    tabby:
      api-url: ${TABBY_API_URL:https://api.tabby.sa}
      secret-key: ${TABBY_SECRET_KEY:}
      merchant-code: ${TABBY_MERCHANT_CODE:}
    tamara:
      api-url: ${TAMARA_API_URL:https://api-sandbox.tamara.co}
      api-token: ${TAMARA_API_TOKEN:}
    instalments:
      min-amount: ${INSTALMENTS_MIN:100}
      max-amount: ${INSTALMENTS_MAX:5000}
      count: 4
  shop:
    # An order paid online keeps its stock for this long; unpaid after that, it is cancelled and the stock returns.
    # الطلب المدفوع أونلاين يحجز مخزونه هالمدة؛ ولو ما اندفع بعدها ينلغي ويرجع المخزون.
    unpaid-hold: ${SHOP_UNPAID_HOLD:30m}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
